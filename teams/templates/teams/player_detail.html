<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ name }} - Player Details</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 90%;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .container:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }
    .player-header {
      margin-bottom: 25px;
    }
    .player-photo {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #007BFF;
      margin-bottom: 20px;
      transition: transform 0.3s ease;
    }
    .player-photo:hover {
      transform: scale(1.1);
    }
    .player-header h1 {
      font-size: 36px;
      margin: 10px 0;
      color: #333;
    }
    .player-info {
      margin-top: 20px;
      text-align: left;
    }
    .player-info p {
      font-size: 18px;
      margin: 10px 0;
      font-weight: bold;
      color: #444;
    }
    .player-info span {
      font-weight: normal;
      color: #555;
    }
    a.back-link {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #007BFF;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    a.back-link:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="player-header">
    {% if photo %}
      <img src="{{ photo }}" alt="{{ name }}" class="player-photo" loading="lazy" />
    {% endif %}
    <h1>{{ name }}</h1>
  </div>

  <div class="player-info">
    <p><strong>Position:</strong> <span>{{ position }}</span></p>
    <p><strong>Appearances:</strong> <span>{{ appearances }}</span></p>
    <p><strong>Goals:</strong> <span>{{ goals }}</span></p>
    <p><strong>Assists:</strong> <span>{{ assists }}</span></p>
    <p><strong>Yellow Cards:</strong> <span>{{ yellow_cards }}</span></p>
    <p><strong>Red Cards:</strong> <span>{{ red_cards }}</span></p>
  </div>

  <a href="{% url 'team_detail' team_id=team_id %}#team-squad" class="back-link">← Back to Team Squad</a>
</div>

</body>
</html>
