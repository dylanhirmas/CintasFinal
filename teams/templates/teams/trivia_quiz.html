<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Soccer Trivia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      margin: 0;
      padding: 0;
      color: white;
    }
    .navbar {
      background-color: rgba(0,0,0,0.75);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: rgba(255,255,255,0.9);
      border-radius: 8px;
      padding: 30px;
      color: #333;
    }
    h1 { text-align: center; margin-bottom: 20px; }
    .question { margin-bottom: 20px; }
    .question label { font-weight: bold; display: block; margin-bottom: 5px; }
    .question input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; }
    button {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background-color: #007BFF;
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background-color: #0056b3; }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      color: #333;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div><strong>Soccer Teams</strong></div>
    <div>
      <a href="{% url 'team_list' %}">Home</a>
      <a href="{% url 'compare_teams' %}">Compare Teams</a>
      <a href="{% url 'league_ai' %}">League AI</a>
      <a href="{% url 'trivia_quiz' %}">Trivia Quiz</a>
    </div>
  </div>

  <div class="container">
    <h1>Soccer Trivia</h1>
    {% for q in questions %}
      <div class="question">
        <label>{{ q.id }}. {{ q.question }}</label>
        <input type="text" id="answer-{{ q.id }}" placeholder="Your answer…" />
      </div>
    {% endfor %}

    <button onclick="submitAll()">Submit Answers</button>

    <div id="results"></div>
  </div>

  <script>
    async function submitAll() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      for (let q of {{ questions|safe }}) {
        const answer = document.getElementById(`answer-${q.id}`).value;
        const res = await fetch("{% url 'submit_trivia' %}", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
          },
          body: JSON.stringify({ question_id: q.id, answer })
        });
        const data = await res.json();
        resultsDiv.innerHTML += `
          <div class="result">
            <strong>Q${q.id}:</strong> ${q.question}<br>
            Your answer: <em>${answer}</em><br>
            ${data.correct
              ? '<span style="color:green;">Correct!</span>'
              : `<span style="color:red;">Incorrect.</span> Correct: ${data.correct_answer}` }
          </div>
        `;
      }
    }
  </script>

</body>
</html>
